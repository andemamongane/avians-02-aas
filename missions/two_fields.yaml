# Ordering with until: field B must be reached before the drone ever enters A.
# The landing is nested after the survey of A (within 60 s of starting it): on
# its own, F (in(home_pad) & alt <= 1) already holds at t = 0, on the pad.
name: two_fields
prompt_file: two_fields.txt
map: maps/field_01.yaml
spec: >-
  (!in(survey_a) U[0,150] G[0,5] in(survey_b))
  & F[0,240] (G[0,5] in(survey_a) & F[0,60] (in(home_pad) & alt <= 1))
  & G[0,300] (!in(nofly_1) & alt <= 15)
max_steps: 25
max_wall_s: 360
description: Visit field B, then field A, avoiding the power lines; land.

dry_run_script:
  - [takeoff, {altitude: 6}]
  - [goto_region, {region: survey_b, altitude: 6}]
  - [hover, {duration: 7}]
  - [goto_region, {region: survey_a, altitude: 6}]
  - [hover, {duration: 7}]
  - [reposition, {east: 0, north: 20, altitude: 6}]
  - [land, {}]

dry_run_plan:
  - [takeoff, {altitude: 6}]
  - [fly_plan, {segments: [{type: region, region: survey_b, altitude: 6},
                           {type: hold, duration: 6},
                           {type: region, region: survey_a, altitude: 6},
                           {type: hold, duration: 6},
                           {type: waypoint, east: 0, north: 20, altitude: 6},
                           {type: land}]}]
  - [wait, {seconds: 240, until: landed}]
